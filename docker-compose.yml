services:
  postgres:
    image: postgres:16
    container_name: cricket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cricket
      POSTGRES_PASSWORD: cricket_dev_password
      POSTGRES_DB: cricket_db
    ports:
      - "5432:5432"
    volumes:
      - cricket_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cricket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  cricket_pgdata: